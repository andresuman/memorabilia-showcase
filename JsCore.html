  const $ = function (s) { return document.querySelector(s); };
  const $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  const esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  // Game Used with nothing filtered: the search, the team chip, the legend (signed / unsigned) and what the

  function guBlank() {
    return { q: '', team: '', signed: '', season: '', sport: '', type: '', usage: '', result: '', attended: false, video: false, matched: false, sort: 'new' };

  /* ---------- Helpers ---------- */
  function teamInfo(name) {
    return TEAMS[name] || { color: NEUTRAL };
  }
  function fmtDate(iso) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return iso || '';
    const p = iso.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function money(n) { return n == null ? '' : '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function initials(name) {
    const parts = String(name).replace(/\b(Jr\.?|Sr\.?|II|III)\b/g, '').replace(/\./g, ' ').trim().split(/\s+/);
    return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
  }
  function title(item) {
    if (item.model && item.type && item.model.toLowerCase().indexOf(item.type.toLowerCase()) !== -1) return item.model;
    return [item.model, item.type].filter(Boolean).join(' ');
  }
  function signerLine(item) {
    const n = item.signatures.map(function (s) { return s.signer; });
    if (n.length === 1) return n[0];
    if (n.length === 2) return n[0] + ' & ' + n[1];
    return n[0] + ' + ' + (n.length - 1) + ' more';
  }
  // The small line above a name, on cards and panels alike: "ID · year · line" (whatever the item has).
  function eyebrow(parts) { return parts.filter(Boolean).join(' · '); }
  // Year of the first signature, or "2023–2025" when the signatures came in different years.
  function itemYear(item) {
    if (!item._first || item._first === '9999') return '';
    const a = item._first.slice(0, 4), b = (item._last || '').slice(0, 4);
    return b && b !== a ? a + '–' + b : a;
  }
  /* Waiting for a collection's first data (only when nothing was kept in this browser). A home card moves the
     same sheen as a photo frame over the whole card (.hub-card.loading), with the number and the line held empty
     at their size (HOLD_NUM, HOLD_TEXT); a summary line on a collection page is a gray bar with a sheen (SKEL_TEXT).
     Nothing jumps when the data comes. */
  const HOLD_NUM = '<span class="hold" aria-hidden="true">00</span>';
  const HOLD_TEXT = '<span class="sr">Loading</span><span class="hold" aria-hidden="true">Loading</span>';
  const SKEL_TEXT = '<span class="sr">Loading</span><i class="skel-line" aria-hidden="true"></i>';
  // The heading over the signatures in every panel: "Signed by 3 people", or just "Signed by" for one person
  // (the name is right below it, on the signature card or the linked item).
  function signedHeading(names) {
    const n = unique(names).length;
    return '<h3>Signed by' + (n > 1 ? ' <span>' + n + ' people</span>' : '') + '</h3>';
  }
  // The same empty list in every collection; its button does what the "Clear filters" link does.
  function emptyHtml(clearId) {
    return '<div class="empty"><h2>Nothing matches yet</h2><p>Try another search, or clear the filters to see everything.</p>' +
      '<button data-clear="' + clearId + '">Clear filters</button></div>';
  }
  document.addEventListener('click', function (e) {
    const b = e.target.closest('[data-clear]');
    if (b) document.getElementById(b.dataset.clear).click();
  });
  /* The bar and legend under a collection's summary. parts: [key, label, count, color]; the legend entries are
     buttons that filter the list (pressing the one already on clears it); active = the key on, or ''. */
  function progressHtml(parts, active, attr) {
    parts = parts.filter(function (p) { return p[2] > 0; });
    return '<div class="pbar" aria-hidden="true">' + parts.map(function (p) {
      return '<span class="' + (p[0] === active ? 'on' : '') + '" style="--n:' + p[2] + ';--c:' + p[3] + '"></span>';
    }).join('') + '</div>' +
      '<div class="legend">' + parts.map(function (p) {
        return '<button class="seg" ' + attr + '="' + esc(p[0]) + '" aria-pressed="' + (p[0] === active) + '" style="--c:' + p[3] + '"><i></i><b>' + p[2] + '</b>' + esc(p[1]) + '</button>';
      }).join('') + '</div>';
  }
  /* An item's lines under its tags, in a panel: an icon, a small gray word and the value in bold, one per line.
     The claim first (who used it: a gray icon, information), then its proof (certificate, photo match: blue icons,

    Boxing: '<path d="M168,16H120A56.06,56.06,0,0,0,64,72H56a32,32,0,0,0-32,32v29.19a16.09,16.09,0,0,0,3.51,10,8,8,0,0,0,.62.69L64,179.34V216a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V177.12l15.38-53.85a15.89,15.89,0,0,0,.62-4.39V72A56.06,56.06,0,0,0,168,16Zm40,102.88L192.31,173.8A7.85,7.85,0,0,0,192,176v40H80V176a8,8,0,0,0-2.38-5.69L40,133.12V104A16,16,0,0,1,56,88h8v16a8,8,0,0,0,16,0V72a40,40,0,0,1,40-40h48a40,40,0,0,1,40,40Zm-36.42,48.28L153.89,176l17.69,8.84a8,8,0,0,1-7.16,14.32L136,184.94l-28.42,14.22a8,8,0,1,1-7.16-14.32L118.11,176l-17.69-8.84a8,8,0,1,1,7.16-14.32L136,167.06l28.42-14.22a8,8,0,1,1,7.16,14.32Z"/>'
  };
  const SPORT_ICON_OTHER = '<path d="M216,96A88,88,0,1,0,72,163.83V240a8,8,0,0,0,11.58,7.16L128,225l44.43,22.21A8.07,8.07,0,0,0,176,248a8,8,0,0,0,8-8V163.83A87.85,87.85,0,0,0,216,96ZM56,96a72,72,0,1,1,72,72A72.08,72.08,0,0,1,56,96ZM168,227.06l-36.43-18.21a8,8,0,0,0-7.16,0L88,227.06V174.37a87.89,87.89,0,0,0,80,0ZM128,152A56,56,0,1,0,72,96,56.06,56.06,0,0,0,128,152Zm0-96A40,40,0,1,1,88,96,40,40,0,0,1,128,56Z"/>';
  function sportIcon(sport) {
    return '<svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">' + (SPORT_ICONS[sport] || SPORT_ICON_OTHER) + '</svg>';
  }
  // The sport a team plays, from its signatures.
  function teamSport(team) {
    for (let i = 0; i < state.items.length; i++) {
      const s = state.items[i].signatures.find(function (x) { return x.team === team && x.sport; });
      if (s) return s.sport;
    }
    return '';
  }
  function logoHtml(team) {
    const logo = state.logos[team];
    return logo ? '<img src="' + esc(logo) + '" alt="">' : sportIcon(teamSport(team));
  }
  // A sport as a team tag, for an item with no team (a boxer): the sport's icon in a gray circle and its name.
  function sportTagHtml(sport) {
    return '<span class="team-tag" style="--c:' + NEUTRAL + '"><span class="dot">' + sportIcon(sport) + '</span>' + esc(sport) + '</span>';
  }
  /* The team on a card: its logo in a small white circle at the bottom left of the photo (up to two teams,
     then "+N"; no logo yet: the sport's icon on the team color; no team: the sport's icon on gray), in place of
     the team name in the text. Kept up to date by loadLogos like every .dot[data-team]. */
  function crestHtml(teams, sports) {
    teams = unique(teams);
    if (!teams.length) {
      // No team (a boxer): the sport's icon in the same circle.
      const sport = unique(sports || [])[0];
      return sport ? '<span class="crest" title="' + esc(sport) + '"><span class="sr">' + esc(sport) + '</span><span class="dot" style="--c:' + NEUTRAL + '" aria-hidden="true">' + sportIcon(sport) + '</span></span>' : '';
    }
    return '<span class="crest" title="' + esc(teams.join(', ')) + '"><span class="sr">' + esc(teams.join(', ')) + '</span>' +
      teams.slice(0, 2).map(function (t) {
        return '<span class="dot" data-team="' + esc(t) + '" style="--c:' + teamInfo(t).color + '" aria-hidden="true">' + logoHtml(t) + '</span>';
      }).join('') + (teams.length > 2 ? '<span class="more" aria-hidden="true">+' + (teams.length - 2) + '</span>' : '') + '</span>';
  }
  // The Teams tab: each team's color, under its name and its former names; then every screen is drawn again in color.
  function loadTeams() {
    loadData('teams', 'getTeams', function (data) {
      Object.keys(TEAMS).forEach(function (k) { delete TEAMS[k]; });
      Object.keys(TEAM_NOW).forEach(function (k) { delete TEAM_NOW[k]; });
      (data.teams || []).forEach(function (t) {
        // Each name, former ones too, to the team today: a renamed team counts once.
        [t.team].concat(t.former || []).forEach(function (n) { TEAM_NOW[n] = t.team; });
        if (!t.color) return;
        [t.team].concat(t.former || []).forEach(function (n) { TEAMS[n] = { color: t.color }; });
      });
      state.teamChecks = data.checks || {};
      renderHub();
      if (state.items.length) render(true);
      if (state.gu) renderGu(true);
      // The Autographed team chips are built once with the collection (they keep which one is pressed): recolor them.
      $$('#teams .team-chip[data-team]').forEach(function (b) { if (b.dataset.team) b.style.setProperty('--c', teamInfo(b.dataset.team).color); });
      refreshPanel();
      updateChecks();
    }, function (err, shownKept) {
      if (shownKept) return;
      state.teamChecks = { noColor: [], teamsTab: [err && err.message ? err.message : String(err)] };
      updateChecks();
    });
  }
  function loadLogos() {
    loadData('logos', 'getLogos', function (logos) {
      state.logos = logos || {};
      // Every logo spot (.dot[data-team]): team chips and team tags.
      $$('.dot[data-team]').forEach(function (d) { if (state.logos[d.dataset.team]) d.innerHTML = logoHtml(d.dataset.team); });
    }, function () { /* the teams keep their sport icons */ });
  }

  /* ---------- Photos: fetched through the script, loaded as they scroll into view ----------
     Sizes: each photo is asked for at the size it is shown (× screen density, at most 2), so the small copies
     stay small enough for the server's cache (about 100 KB per item). The same photo in the same size is shared
     by every place that shows it. Copies up to KEEP_W are also kept in this browser (IndexedDB), so a photo
     seen once shows up at once the next time the app opens; photo references carry the file's last-updated
     time (photoRef_ in Code.gs), so a replaced photo never shows its old copy. */
  const CARD_W = 240;  // cards in the grids (2 columns on a phone, 5 on a computer)
  const ROW_W = 64;    // thumbnails under the panel photo and photos in the link rows
  const KEEP_W = 1400; // larger copies (the full-screen viewer) are not kept in the browser
  const photoCache = {};
  const photoQueue = [];
  let photoActive = 0;
  const localPreview = {};
  function loadPhoto(pid, w) {
    if (localPreview[pid]) return Promise.resolve(localPreview[pid]);
    const key = pid + '@' + w;
    if (photoCache[key]) return photoCache[key];
    photoCache[key] = keptPhoto(key).then(function (kept) {
      return kept || photoFromServer(pid, w).then(function (uri) {
        if (w <= KEEP_W) keepPhoto(key, uri);
        return uri;
      });
    });
    photoCache[key].catch(function () { delete photoCache[key]; });
    return photoCache[key];
  }
  function photoFromServer(pid, w) {
    return new Promise(function (resolve, reject) {
      if (!(window.google && google.script && google.script.run)) { resolve(pid); return; }
      photoQueue.push(function () {
        photoActive++;
        google.script.run
          .withSuccessHandler(function (uri) { photoActive--; pump(); resolve(uri); })
          .withFailureHandler(function (err) { photoActive--; pump(); reject(err); })
          .getPhoto(pid, w);
      });
      pump();
    });
  }
  function pump() { while (photoActive < 4 && photoQueue.length) photoQueue.shift()(); }
  // Width to ask the server for: the shown width × screen density, at most 1400 px
  // (the full 2048 px is only fetched by the full-screen viewer).
  function photoWidth(w) { return Math.min(1400, Math.round(w * Math.min(window.devicePixelRatio || 1, 2))); }
  // The panel photo, sized to the photo area on this screen and rounded to 200 px steps
  // (about 800 px on an iPhone, so the copy is shared by every panel and kept in the browser).
  function panelPhotoWidth() {
    const media = $('#d-stage .media');
    const shown = media ? Math.max(media.clientWidth, media.clientHeight) : 500;
    return Math.min(1400, Math.max(200, Math.round(photoWidth(shown || 500) / 200) * 200));
  }

  /* Kept in this browser (IndexedDB "memorabilia-showcase"): store "photos" ({ k: key, uri, at }), store "data"
     (the last answer of getCollection, getGameUsed and getLogos, see loadData) and store
     "videos" (the videos of the plays as they arrived, keyed by their reference, see loadVideo in JsPanel).
     Best effort: when storage is not available (private window, full disk...) photos just come from the server.
     Old copies are trimmed when there are more than KEEP_MAX. */
  const KEEP_MAX = 600;
  let photoDb = null;
  function openPhotoDb() {
    if (photoDb) return photoDb;
    photoDb = new Promise(function (resolve) {
      try {
        const req = indexedDB.open('memorabilia-showcase', 3);
        req.onupgradeneeded = function () {
          const db = req.result;
          if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos', { keyPath: 'k' }).createIndex('at', 'at');
          if (!db.objectStoreNames.contains('data')) db.createObjectStore('data'); // the last answer of each server call
          if (!db.objectStoreNames.contains('videos')) db.createObjectStore('videos'); // ref -> the video (a Blob)
        };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = req.onblocked = function () { resolve(null); };
      } catch (e) { resolve(null); }
    });
    return photoDb;
  }
  function keptPhoto(key) {
    return openPhotoDb().then(function (db) {
      if (!db) return null;
      return new Promise(function (resolve) {
        try {
          const req = db.transaction('photos').objectStore('photos').get(key);
          req.onsuccess = function () { resolve(req.result ? req.result.uri : null); };
          req.onerror = function () { resolve(null); };
        } catch (e) { resolve(null); }
      });
    });
  }
  function keepPhoto(key, uri) {
    openPhotoDb().then(function (db) {
      if (!db) return;
      try { db.transaction('photos', 'readwrite').objectStore('photos').put({ k: key, uri: uri, at: Date.now() }); } catch (e) { /* not kept */ }
    });
  }
  function trimKeptPhotos() {
    openPhotoDb().then(function (db) {
      if (!db) return;
      try {
        const store = db.transaction('photos', 'readwrite').objectStore('photos');
        const count = store.count();
        count.onsuccess = function () {
          let extra = count.result - KEEP_MAX;
          if (extra <= 0) return;
          store.index('at').openCursor().onsuccess = function (e) {
            const cur = e.target.result;
            if (!cur || extra-- <= 0) return;
            cur.delete();
            cur.continue();
          };
        };
      } catch (e) { /* nothing to trim */ }
    });
  }
  function showImg(img) {
    if (img.dataset.state) return;
    img.dataset.state = 'loading';
    const w = img.dataset.w === 'fit' ? panelPhotoWidth() : photoWidth(+img.dataset.w);
    loadPhoto(img.dataset.pid, w).then(function (src) {
      img.onload = function () { img.hidden = false; const ph = img.parentNode.querySelector('.ph'); if (ph && img.closest('.media') === ph.parentNode) ph.hidden = true; };
      img.src = src;
    }, function () {
      img.dataset.state = 'failed';
      const ph = img.parentNode.querySelector(':scope > .ph');
      if (ph) ph.classList.remove('loading');
    });
  }
  // Watch the photo frame, not the photo: the photo stays hidden until it loads,
  // and a hidden element never counts as being on screen.
  const photoObserver = 'IntersectionObserver' in window
    ? new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (!e.isIntersecting) return;
          photoObserver.unobserve(e.target);
          const img = e.target.querySelector(':scope > img[data-pid]:not([data-state])');
          if (img) showImg(img);
        });
      }, { rootMargin: '400px 0px' })
    : null;
  function hydrate(root) {
    root.querySelectorAll('img[data-pid]:not([data-state])').forEach(function (img) {
      if (photoObserver && !img.dataset.eager) photoObserver.observe(img.parentNode); else showImg(img);
    });
  }

  /* ---------- Load ----------
     The app opens with what it showed last time (kept in this browser) and asks the spreadsheet at the same
     time; when the answer arrives it redraws only if something changed. The reload buttons spin while the
     app is checking, so a still button means what is on screen is current. */
  let syncingCalls = 0;
  function syncing(d) {
    syncingCalls += d;
    document.body.classList.toggle('syncing', syncingCalls > 0);
  }
  function callServer(fn, sample) {
    return new Promise(function (resolve, reject) {
      if (window.google && google.script && google.script.run) google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn]();
      else if (sample) setTimeout(function () { resolve(JSON.parse(JSON.stringify(sample))); }, 250);
      else reject(new Error('This page needs to run as the Apps Script web app.'));
    });
  }
  function keptData(name) {
    return openPhotoDb().then(function (db) {
      if (!db) return null;
      return new Promise(function (resolve) {
        try {
          const req = db.transaction('data').objectStore('data').get(name);
          req.onsuccess = function () { resolve(req.result || null); };
          req.onerror = function () { resolve(null); };
        } catch (e) { resolve(null); }
      });
    });
  }
  function keepData(name, data) {
    openPhotoDb().then(function (db) {
      if (!db) return;
      try { db.transaction('data', 'readwrite').objectStore('data').put(data, name); } catch (e) { /* not kept */ }
    });
  }
  /* name: what is kept; fn: the Code.gs function; apply(data, replacing): draws it (replacing = it replaces
     what was shown from the kept copy, so lists keep their scroll and an open panel stays open);
     failed(err, shownKept): the server call failed. */
  const shownData = {}; // name -> JSON of what is on screen (from the kept copy or the server)
  function loadData(name, fn, apply, failed, sample) {
    let answered = false;
    syncing(1);
    if (!(name in shownData)) {
      keptData(name).then(function (kept) {
        if (!kept || answered || name in shownData) return;
        shownData[name] = JSON.stringify(kept);
        apply(kept, false);
      });
    }
    callServer(fn, sample).then(function (data) {
      answered = true;
      syncing(-1);
      const json = JSON.stringify(data);
      keepData(name, JSON.parse(json)); // before apply, which adds working fields to the objects
      if (json === shownData[name]) return; // nothing changed: nothing to redraw
      const replacing = name in shownData;
      shownData[name] = json;
      apply(data, replacing);
    }, function (err) {
      answered = true;
      syncing(-1);
      failed(err, name in shownData);
    });
  }
  // After new data: redraws the open panel (if any) where it was.
  function refreshPanel() {
    const scrim = $('#scrim'), top = scrim.scrollTop;
    route(state.hash);
    if (state.currentId) scrim.scrollTop = top;
  }

  function load() {
    if (!state.items.length) {
      $('#grid').className = 'grid';
      $('#grid').innerHTML = skelGrid(8);
    }
    loadData('collection', 'getCollection', ready, function (err, shownKept) {
      if (shownKept) toast('Could not check the spreadsheet: showing what was here last time.', true); else fail(err);
    }, window.SAMPLE_DATA);
  }

  function ready(data, replacing) {
    if (data.missing) {
      state.amMissing = true;
      state.items = [];
      state.checks.am = data.checks || {};
      setMenuLinks([['sheet', '#lnk-sheet'], ['photos', '#lnk-photos'], ['logos', '#lnk-logos']], data.links || {});
      $('#summary').textContent = '';
      showMissing($('#grid'), data.missing, load);
      renderHub();
      updateChecks();
      return;
    }
    state.amMissing = false;
    state.items = data.items || [];
    state.checks.am = data.checks;
    setMenuLinks([['sheet', '#lnk-sheet'], ['photos', '#lnk-photos'], ['logos', '#lnk-logos']], data.links || {});
    state.items.forEach(function (it) {
      it._first = it.signatures.reduce(function (m, s) { return s.date && s.date < m ? s.date : m; }, '9999');
      it._last = it.signatures.reduce(function (m, s) { return s.date && s.date > m ? s.date : m; }, '');
      it._text = searchable([it.id, it.type, it.model, it.detail, it.usage, it.itemAuth, it.itemCert].concat(it.signatures.map(function (s) {
        return [s.signer, s.team, s.sport, s.inscription, s.at, s.giftedBy, s.autoAuth, s.autoCert, s.notes, s.how].join(' ');
      })).join(' '));
    });
    buildHero();
    buildFilters();
    render(replacing);
    refreshPanel();
    renderHub();
    if (state.gu) renderGu(true);
    updateChecks();
  }

  // Every reload button reads every collection and the Teams tab again (the panels link them to each other).
  function reloadAll() { loadTeams(); load(); loadGu(); loadLogos(); }

  /* A collection whose tab is missing: the page says the collection is not set up yet (and the other
     collection is unaffected), instead of the error page. */
  function showMissing(grid, tab, retry) {
    grid.innerHTML = '<div class="empty"><h2>No ' + esc(tab) + ' yet</h2><p>The spreadsheet has no tab named "' +
      esc(tab) + '", or it could not be read. Add the tab (see Setup in the README) and reload — the other collection is unaffected.</p>' +
      '<button type="button">Try again</button></div>';
    grid.querySelector('button').addEventListener('click', retry);
  }

  function fail(err) {
    $('#summary').textContent = '';
    $('#grid').innerHTML = '<div class="empty"><h2>The collection didn’t load</h2><p>' + esc(err && err.message ? err.message : String(err)) +
      '</p><p>Check that the spreadsheet has a tab named “Autographed Memorabilia”, then try again.</p><button id="retry">Try again</button></div>';
    const r = $('#retry'); if (r) r.addEventListener('click', load);
  }
</script>
